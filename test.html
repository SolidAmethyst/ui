<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid UI Toolkit Test</title>
    <script type="module" src="/src/index.ts"></script>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import { render } from 'solid-js/web'
        import { Scrollbar } from './src/components/ui/scrollbar'
        
        function App() {
            return (
                <div style="width: 400px; height: 100px; border: 1px solid #ccc; margin: 20px;">
                    <Scrollbar direction="horizontal" showArrows={false}>
                        <div style="display: flex; width: 800px; gap: 10px;">
                            {Array.from({ length: 20 }, (_, i) => (
                                <div
                                    style={{
                                        'min-width': '100px',
                                        height: '80px',
                                        'background-color': '#f0f0f0',
                                        display: 'flex',
                                        'align-items': 'center',
                                        'justify-content': 'center',
                                        'border-radius': '4px'
                                    }}
                                >
                                    Item {i + 1}
                                </div>
                            ))}
                        </div>
                    </Scrollbar>
                </div>
            )
        }
        
        render(() => <App />, document.getElementById('app'))
    </script>
</body>
</html>
