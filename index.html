<!DOCTYPE html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Solid UI Toolkit</title>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239C27B0'><path d='M12,2L6,7L12,12L18,7L12,2M12,12L6,17L12,22L18,17L12,12Z'/></svg>" />
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			.material-symbols-rounded.filled {
				font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
			}
			body,
			html {
				background: white;
			}
			body:has([data-theme='dark']),
			html:has([data-theme='dark']) {
				background: hsl(240 20% 8%);
			}
			body,
			html,
			div,
			span,
			h1,
			h2,
			h3,
			h4,
			h5,
			h6,
			p,
			button,
			input,
			textarea,
			select {
				font-family: var(--font-family, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
			}
			.material-symbols-rounded {
				font-family: 'Material Symbols Rounded' !important;
			}
			#app {
				background: transparent !important;
			}
		</style>
		<script>
			window.React = {
				createElement: function() { return null; },
				Fragment: 'Fragment',
				Component: class {},
				PureComponent: class {},
				createContext: function() { return {}; },
				forwardRef: function(fn) { return fn; },
				memo: function(fn) { return fn; }
			};
		</script>
		<script type="module" src="/src/demo/index.tsx"></script>
	</head>
	<body>
		<div id="app"></div>
	</body>
</html>
