name: Tests and Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:run

      - name: Generate coverage report
        if: success()
        run: npm run test:coverage

  theme-tests:
    name: Theme Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for hardcoded colors
        id: hardcoded
        run: npm run test:theme-hardcoded
        continue-on-error: true

      - name: Check theme application
        id: application
        run: npm run test:theme-application
        continue-on-error: true

      - name: Run visual regression tests
        id: visual
        run: npm run test:visual-regression
        continue-on-error: true

      - name: Fail if theme tests failed
        if: steps.hardcoded.outcome == 'failure' || steps.application.outcome == 'failure' || steps.visual.outcome == 'failure'
        run: |
          echo "Theme tests failed:"
          if [ "${{ steps.hardcoded.outcome }}" == "failure" ]; then
            echo "  - Hardcoded colors detected"
          fi
          if [ "${{ steps.application.outcome }}" == "failure" ]; then
            echo "  - Theme application issues detected"
          fi
          if [ "${{ steps.visual.outcome }}" == "failure" ]; then
            echo "  - Visual regression issues detected"
          fi
          exit 1

  layout-tests:
    name: Layout Theme Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run layout tests
        run: npm run test:layout

  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, theme-tests, layout-tests, format-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.theme-tests.result }}" != "success" ] || \
             [ "${{ needs.layout-tests.result }}" != "success" ] || \
             [ "${{ needs.format-check.result }}" != "success" ]; then
            echo "Quality gate failed. One or more checks did not pass."
            exit 1
          fi
          echo "All quality checks passed!"
